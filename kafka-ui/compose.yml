# Kafka UI separado del clúster: se puede reiniciar o actualizar sin tocar los brokers.
#
# Por defecto se conecta a los brokers por la red compartida de Docker
# (rutaexpress-shared, a la que se unen kafka1..3 en ../kafka/compose.override.yml)
# usando el listener INTERNAL kafkaN:29092.
#
# Si corre en otra máquina, apuntarlo a la IP privada de ec2-kafka:
#   KAFKA_UI_BOOTSTRAP_SERVERS=172.31.80.112:9092,172.31.80.112:9093,172.31.80.112:9094
services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    mem_limit: 512m
    ports: ["${KAFKA_UI_PORT:-8090}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: rutaexpress
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "${KAFKA_UI_BOOTSTRAP_SERVERS:-kafka1:29092,kafka2:29092,kafka3:29092}"
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    networks: [rutaexpress-shared]

networks:
  rutaexpress-shared:
    external: true
