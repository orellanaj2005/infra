# Formación automática del clúster: al arrancar con el directorio de datos vacío,
# cada nodo busca a los nodos de esta lista y se une a ellos.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Reintentos mientras el otro nodo termina de arrancar
cluster_formation.discovery_retry_limit = 30
cluster_formation.discovery_retry_interval = 2000

# El contenedor tiene 768 MB; RabbitMQ bloquea a los productores al llegar a este umbral
vm_memory_high_watermark.absolute = 512MiB
disk_free_limit.absolute = 1GB

# Si los nodos pierden contacto entre sí, al reconectarse se quedan con el estado de uno solo
cluster_partition_handling = autoheal